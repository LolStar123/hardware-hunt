<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>hardware hunt / bid limit</title><link rel="stylesheet" href="style.css"></head><body>
<header><a href="https://lolstar123.github.io/just-a-little-further/">atul / hardware hunt</a><a href="https://github.com/LolStar123/hardware-hunt">source</a></header>
<main>
<section class="hero"><p>liquidation auctions</p><h1>pick the lot.<br><em>know the limit.</em></h1></section>
<label class="search">find hardware<input id="search" type="search" placeholder="RTX, workstation, laptop…"></label>
<div class="workspace">
<section class="catalogue"><p id="count" role="status">loading lots…</p><div id="lots"></div><nav class="pagination"><button id="previous">←</button><span id="page"></span><button id="next">→</button></nav></section>
<aside id="bid-calculator"><a class="back-to-results" href="#lots">← lots</a><p id="lot-sale"></p><h2 id="lot-title">select a lot</h2><p id="lot-result"></p><div id="result"><span>maximum hammer</span><strong id="maximum"></strong><p id="verdict"></p></div>
<form id="calculator"><div class="inputs"><label>resale £<input id="resale" type="number" min="0" step="10" value="600"></label><label>failure %<input id="failure" type="number" min="0" max="100" value="20"></label><label>target profit £<input id="profit" type="number" min="0" value="100"></label><label>test hammer £<input id="hammer" type="number" min="0" value="0"></label></div><details><summary>fees &amp; costs</summary><div class="inputs"><label>salvage £<input id="salvage" type="number" min="0" value="80"></label><label>selling %<input id="selling" type="number" min="0" max="100" value="12"></label><label>collection £<input id="transport" type="number" min="0" value="35"></label><label>repair £<input id="repair" type="number" min="0" value="20"></label><label>premium %<input id="premium" type="number" min="0" step=".5" value="17.5"></label><label>VAT %<input id="vat" type="number" min="0" max="100" value="20"></label></div></details></form>
<p id="error"></p><button id="save">save bid</button><p id="saved-status"></p><a id="lot-source" target="_blank" rel="noopener">lot page</a>
<div hidden><svg id="waterfall"></svg><dl id="breakdown"></dl><p id="downside"></p></div></aside>
</div>
<details class="filters"><summary>filter lots</summary><label>sale<select id="sale"><option value="">all</option></select></label><label>type<select id="category"><option value="">all</option></select></label><label>sort<select id="sort"><option value="lot">lot number</option><option value="high">highest hammer</option><option value="low">lowest hammer</option></select></label></details>
<details class="sheet"><summary>saved bids <span id="sheet-count">0</span></summary><div id="sheet"></div><button id="export">download CSV</button></details><p id="provenance"></p>
</main><script type="module" src="app.mjs"></script></body></html>
